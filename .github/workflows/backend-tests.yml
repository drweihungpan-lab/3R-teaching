name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - implement/course-framework

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: python -m pytest backend/tests

  container-comparison:
    name: Docker output comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install ./backend
      - name: Capture and compare repeated local runs
        run: |
          python -m stat_core.capture --participants data/synthetic/dm.csv --laboratory data/synthetic/lb.csv --output outputs/local-1.json
          python -m stat_core.capture --participants data/synthetic/dm.csv --laboratory data/synthetic/lb.csv --output outputs/local-2.json
          python -m stat_core.comparison outputs/local-1.json outputs/local-2.json | tee outputs/repeatability.txt
      - name: Build and start both real services
        run: |
          docker compose version
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 120
      - name: Check backend and frontend health and service DNS
        run: |
          curl --fail-with-body http://127.0.0.1:8000/health | tee outputs/backend-health.json
          curl --fail-with-body --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8501/_stcore/health | tee outputs/frontend-health.txt
          docker compose exec -T frontend python -c "import urllib.request; print(urllib.request.urlopen('http://backend:8000/health', timeout=5).read().decode())" | tee outputs/service-dns.txt
      - name: Capture Docker output and compare with local output
        run: |
          docker compose exec -T backend python -m stat_core.capture --participants data/synthetic/dm.csv --laboratory data/synthetic/lb.csv > outputs/docker.json
          python -m stat_core.comparison outputs/local-1.json outputs/docker.json | tee outputs/replicability.txt
      - name: Upload real CSVs through the published API and compare results
        run: |
          curl --fail-with-body http://127.0.0.1:8000/process -F participants=@data/synthetic/dm.csv -F laboratory=@data/synthetic/lb.csv --output outputs/api-result.json
          python - <<'PY' | tee outputs/api-comparison.txt
          import json
          from pathlib import Path
          from stat_core.comparison import compare_results
          local = json.loads(Path('outputs/local-1.json').read_text())
          api = json.loads(Path('outputs/api-result.json').read_text())
          compare_results(local['result'], api)
          print('Real multipart API output agrees with the local processing result.')
          PY
      - name: Collect Compose evidence
        if: always()
        run: |
          mkdir -p outputs
          docker compose ps --all > outputs/compose-ps.txt
          docker compose logs --no-color > outputs/compose.log
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: output-comparison-evidence
          path: outputs/
          retention-days: 7
      - name: Stop Compose services
        if: always()
        run: docker compose down
